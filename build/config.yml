version: "3"

# 构建元信息（修改后可执行：wails3 task common:update:build-assets）
info:
  companyName: "yhfx186"
  productName: "Cursor助手"
  # lyh用cursor修改 2026-08-01：同步 0.0.42 稳定性修复时保留 fork 独立应用标识与维护者信息
  productIdentifier: "com.yhfx186.cursorassistant"
  description: "Cursor 助手｜自定义 API"
  copyright: "© 2026, yhfx186"
  comments: "作者 yhfx186"
  version: "0.0.42"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:

other:
  - name: 其他数据
